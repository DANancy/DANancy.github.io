name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so sitemap lastmod reflects real edit dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Turbopack's next/font/google resolution fails intermittently ("queries have exactly one entry"); retry clean builds.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            rm -rf .next out
            npm run build && exit 0
            echo "::warning::Build attempt $attempt failed; retrying"
          done
          exit 1
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GUESTBOOK_URL: ${{ vars.NEXT_PUBLIC_GUESTBOOK_URL }}

      - name: Ensure CNAME survives export
        run: cp CNAME out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
